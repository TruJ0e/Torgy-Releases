name: finish-upload-046
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download installer from Drive
        run: |
          pip install -q gdown
          gdown "1EuwayLRz6xEUfH0PkAbWW4eKwJjGX-Yp" -O Torgy_0.4.6-beta_x64-setup.exe
          ls -la Torgy_0.4.6-beta_x64-setup.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.4.6-beta --repo TruJ0e/Torgy-Releases --clobber \
            Torgy_0.4.6-beta_x64-setup.exe \
            release-assets-046/Torgy_0.4.6-beta_x64-setup.exe.sig \
            release-assets-046/Torgy_Machine_Agent_0.4.6-beta_x64-setup.exe \
            release-assets-046/Torgy_Machine_Agent_0.4.6-beta_x64-setup.exe.sig \
            release-assets-046/latest.json
          gh release view v0.4.6-beta --repo TruJ0e/Torgy-Releases --json assets --jq '.assets[] | "\(.name) \(.state)"'
