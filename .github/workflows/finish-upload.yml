name: finish-release-upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer from Drive
        run: |
          pip install -q gdown
          gdown "1EuwayLRz6xEUfH0PkAbWW4eKwJjGX-Yp" -O Torgy_0.4.5-beta_x64-setup.exe
          ls -la Torgy_0.4.5-beta_x64-setup.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.4.5-beta --clobber Torgy_0.4.5-beta_x64-setup.exe
          gh release view v0.4.5-beta --json assets --jq '.assets[] | "\(.name) \(.state)"'
